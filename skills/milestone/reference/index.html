<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernwise · Milestone</title>
<style>
  html, body { margin: 0; height: 100%; background: #1E3822; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="kit.js"></script>
<script src="assets/screens/screens.js"></script> <!-- the captures and their rects: plans/mobile.json, written by scripts/screens.mjs -->
<script>
// Milestone: a short film for a number a product has reached, from the one action it counts. One tap
// on the product's real screen does the thing once ("Water Monty": his ring fills); that one result lifts
// out of the app and multiplies into thousands as a counter rolls to the milestone; the thousands close
// into the product's icon. Filled with Fernwise, a fictional plant-care app made for omnigami's examples
// (cast/fernwise): Monty's page, captured as his ring fills (plans/mobile.json), and every plant's
// portrait with a full ring. Tall (9:16).
(() => {
  const { clamp, lerp, spring, loadFont, loadImage, measure, roundRect, easeOutExpo, easeInOutCubic } = window.kit;
  const FPS = 60, BEAT = 0.5;
  // the founder's pauses (2026-10-22): pause for what the viewer needs to read or find, never on the product's own
  // working. Whole beats go in before these original times (the beats below are written on the original 14 s grid
  // and shifted): a beat before the touch (the phone has just risen: the eye finds "Water Monty" first), a beat
  // before the lift ("One plant, watered." is read), a beat before the thanks (the number and its line are read) and
  // a beat before the words leave (the thanks is read). The counter, the field and the close keep their pace.
  const INSERTS = [[1.5, BEAT], [4.3, BEAT], [9.4, BEAT], [10.7, BEAT]];
  const at = (x) => x + INSERTS.reduce((a, [p, d]) => a + (x >= p ? d : 0), 0); // an original time, at its new time
  const DURATION = at(28 * BEAT); // 120 BPM, 32 beats, 16 s
  const W = 1080, H = 1920;
  const canvas = document.getElementById('c');
  const g = kit.textContext(canvas.getContext('2d', { willReadFrequently: true }));
  const helper = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, kit.textContext(c.getContext('2d', { willReadFrequently: true }))]; };
  const [fieldC, FL] = helper(W, H), [sceneC, SC] = helper(2200, 2200), [phoneC, PL] = helper(W, H);
  const OX = (sceneC.width - W) / 2, OY = (sceneC.height - H) / 2;

  // ---------- Fernwise: colour, type, mark (cast/fernwise/brand.md) ----------
  const GROUND = ['#2C4F2E', '#1A3120'], CREAM = '#F6F1E7', SPROUT = '#9CC57A', MOSS = '#3E6B3A', DEEP = '#16291A';
  const SERIF = (s, w = 480) => `${w} ${s}px Fraunces`, ITALIC = (s, w = 480) => `${w} ${s}px "Fraunces Italic"`, SANS = (s, w = 600) => `${w} ${s}px Nunito`;
  const MARK = new Path2D('M126 129V180C126 214 102 236 70 236C54 236 40 232 27 224L40 200C49 205 59 208 69 208C84 208 92 198 92 182V129H57V99H92V78C92 39 114 19 149 19C172 19 190 28 203 42L182 65C173 55 163 50 152 50C134 50 126 61 126 80V99H180L169 129Z');

  // ---------- the words: named fields ----------
  const DEFAULTS = { tap: 'One tap.', one: 'One plant, watered.', number: '1,000,000', what: 'plants watered on time.', thanks: 'Thank you.', name: 'Fernwise', tagline: 'Keep the little ones alive.' };
  const FIELDS = [
    { id: 'tap', type: 'text', label: 'Before the action', maxLength: 18 },
    { id: 'one', type: 'text', label: 'After the action', maxLength: 22, help: 'The one result the milestone counts.' },
    { id: 'number', type: 'text', label: 'The milestone', maxLength: 11, help: 'Digits and separators only: the counter rolls to it.' },
    { id: 'what', type: 'text', label: 'What it counts', maxLength: 28 },
    { id: 'thanks', type: 'text', label: 'Thanks line', maxLength: 18 },
    { id: 'name', type: 'text', label: 'Product name', maxLength: 12 },
    { id: 'tagline', type: 'text', label: 'Tagline', maxLength: 32 },
  ];
  let V = DEFAULTS;

  // ---------- the beats (120 BPM) ----------
  const T = {
    head: at(0.3), phone: [at(0.45), at(1.3)], touch: at(1.55), tap: at(2.0), fill: [at(2.05), at(3.15)], push: [at(2.05), at(2.9)], watered: at(3.18), one: at(3.25),
    lift: [at(4.4), at(5.3)], grow: at(5.1), zoom: [at(5.2), at(8.0)], count: [at(5.3), at(7.9)], what: at(8.1), thanks: at(9.45), out: at(10.75),
    close: [at(10.85), at(11.75)], mark: at(11.8), word: at(12.2), tagline: at(12.5),
  };

  // ---------- the phone (an unbranded phone, photographed, its screen cut out) and Monty's page ----------
  const PHONE_SCREEN = [25, 26, 490, 1118], U = 1.7;
  // Match the photograph's 49 px aperture mask at its native 490 px width; the photograph supplies the final edge.
  const SW = 390 * U, SH = SW * PHONE_SCREEN[3] / PHONE_SCREEN[2], SR = 49 * SW / PHONE_SCREEN[2];
  const SCR = { img: {}, scale: 4, rects: {}, caps: {}, mips: {} };
  const PLANTS = ['monty', 'pickles', 'fernando', 'olive', 'spike', 'basil', 'dot'];
  // the page while the ring fills: one capture per 5 % of the ring, then the real watered page
  const pageAt = (t) => (t >= T.watered ? 'plant-100' : 'plant-000');
  // the ring as it fills: the app's own ring (a 212 px portrait, stroke 2.4 of its 100-unit box, round caps,
  // from the top, clockwise) and its own colours (terracotta when due, through ochre, to moss), drawn over
  // the page until the real watered page takes over. A soft start and a soft landing (ease in-out, quartic).
  const STOPS = [[0, [217, 115, 78]], [0.3, [208, 150, 70]], [0.55, [120, 152, 72]], [1, [62, 107, 58]]];
  const ringColor = (l) => { for (let i = 1; i < STOPS.length; i++) if (l <= STOPS[i][0]) { const [a, ca] = STOPS[i - 1], [b, cb] = STOPS[i], u = (l - a) / (b - a); return `rgb(${ca.map((v, k) => Math.round(v + (cb[k] - v) * u)).join(',')})`; } return 'rgb(62,107,58)'; };
  const fillAt = (t) => { const q = clamp((t - T.fill[0]) / (T.fill[1] - T.fill[0])); return q < 0.5 ? 8 * q ** 4 : 1 - (-2 * q + 2) ** 4 / 2; };
  function ring(c, t) {
    const p = fillAt(t); if (p <= 0 || t >= T.watered) return;
    const Q = SCR.rects.plant.portrait, k = Q[2] / 100, cx = Q[0] + Q[2] / 2, cy = Q[1] + Q[3] / 2, sw = 2.4 * k, r = (50 - 1.2) * k;
    c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.strokeStyle = `rgba(230,220,202,${p})`; c.lineWidth = sw; c.stroke(); // the track turns from due-pink to cream
    c.beginPath(); c.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.max(0.04, p) * Math.PI * 2); c.strokeStyle = ringColor(p); c.lineCap = 'round'; c.stroke();
  }
  // the phone: rises in; after the tap it pushes in on Monty (his portrait stays put as the frame's anchor)
  function phoneAt(t) {
    const up = easeOutExpo(clamp((t - T.phone[0]) / (T.phone[1] - T.phone[0]))), push = easeInOutCubic(clamp((t - T.push[0]) / (T.push[1] - T.push[0])));
    const z = 1 + 0.4 * push, P = SCR.rects.plant.portrait, ax = P[0] + P[2] / 2, ay = P[1] + P[3] / 2; // the portrait's centre, CSS px
    const x0 = W / 2 - SW / 2, y0 = 700 + (1 - up) * 1350, fx = x0 + ax * U, fy = y0 + ay * U; // where the portrait sits in the frame
    return { x: fx - ax * U * z, y: fy - ay * U * z, k: U * z, fx, fy };
  }
  function phone(c, x, y, k, front) { // the photograph, scaled with the screen
    const [sx, sy, sw] = PHONE_SCREEN, f = (SW / sw) * (k / U), img = SCR.phone;
    c.save(); if (!front) { c.shadowColor = 'rgba(5,20,8,0.45)'; c.shadowBlur = 70; c.shadowOffsetY = 30; }
    c.drawImage(img, x - sx * f, y - sy * f, img.width * f, img.height * f); c.restore();
  }
  const shot = (c, name, x, y, k) => { const im = SCR.img[name]; c.drawImage(im, x, y, im.width * k / SCR.scale, im.height * k / SCR.scale); };
  function drawPhone(t, c = g) {
    const P = phoneAt(t), w = SW * P.k / U, h = SH * P.k / U;
    if (P.y > H) return P;
    phone(c, P.x, P.y, P.k, false);
    c.save(); roundRect(c, P.x, P.y, w, h, SR * P.k / U); c.clip(); c.fillStyle = CREAM; c.fillRect(P.x, P.y, w, h);
    shot(c, pageAt(t), P.x, P.y, P.k);
    c.save(); c.translate(P.x, P.y); c.scale(P.k, P.k); ring(c, t); c.restore(); // the ring fills, as the app fills it
    // the status line rolls over as the page turns watered: "Due today" lifts out, then "Watered today · Next drink in
    // about 6 days" lifts in (one line at a time; swapped in a frame it read as a jump)
    if (t >= T.watered && t < T.watered + 0.3) {
      const S = SCR.rects.plant.status, x = P.x + S[0] * P.k, y = P.y + (S[1] - 2) * P.k, w = S[2] * P.k, h = (S[3] + 4) * P.k;
      const eo = easeInOutCubic(clamp((t - T.watered) / 0.12)), ei = easeInOutCubic(clamp((t - T.watered - 0.1) / 0.18));
      c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip(); c.fillStyle = CREAM; c.fillRect(x, y, w, h);
      const line = (name, dy, a) => { if (a <= 0) return; c.globalAlpha = a; c.drawImage(SCR.img[name], S[0] * 4, (S[1] - 2) * 4, S[2] * 4, (S[3] + 4) * 4, x, y + dy * P.k, w, h); c.globalAlpha = 1; };
      line('plant-000', -10 * eo, 1 - eo); line('plant-100', 10 * (1 - ei), ei);
      c.restore();
    }
    // once his portrait lifts out of the app, the page keeps an empty space where it was
    if (t >= T.lift[0]) { const Q = SCR.rects.plant.portrait; c.fillStyle = CREAM; c.beginPath(); c.arc(P.x + (Q[0] + Q[2] / 2) * P.k, P.y + (Q[1] + Q[3] / 2) * P.k, (Q[2] / 2 + 8) * P.k, 0, Math.PI * 2); c.fill(); }
    // the tap: "Water Monty" sinks under the finger and lights a touch, its touch ring spreading
    const B = SCR.rects.plant.water, pr = t < T.tap - 0.07 ? 0 : t < T.tap ? easeOutExpo((t - T.tap + 0.07) / 0.07) : 1 - easeInOutCubic(clamp((t - T.tap) / 0.22));
    if (pr > 0 && t < T.watered) {
      const bx = P.x + B[0] * P.k, by = P.y + B[1] * P.k, bw = B[2] * P.k, bh = B[3] * P.k, cx = bx + bw / 2, cy = by + bh / 2;
      c.fillStyle = CREAM; c.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
      c.save(); c.translate(cx, cy); c.scale(1 - 0.04 * pr, 1 - 0.04 * pr); c.translate(-cx, -cy);
      roundRect(c, bx, by, bw, bh, bh / 2); c.clip(); const im = SCR.img['plant-000'];
      c.drawImage(im, B[0] * 4, B[1] * 4, B[2] * 4, B[3] * 4, bx, by, bw, bh); c.fillStyle = `rgba(255,255,255,${0.14 * pr})`; c.fillRect(bx, by, bw, bh); c.restore();
    }
    c.restore();
    phone(c, P.x, P.y, P.k, true);
    // the finger's touch: a soft disc that settles on the button and spreads as it lands
    const tp = clamp((t - T.touch) / 0.3), tq = clamp((t - T.tap) / 0.45);
    if (tp > 0 && tq < 1) {
      const tx = P.x + (B[0] + B[2] * 0.62) * P.k, ty = P.y + (B[1] + B[3] * 0.55) * P.k;
      c.beginPath(); c.arc(tx, ty, 34 * easeOutExpo(tp) * (1 - 0.15 * pr), 0, Math.PI * 2); c.fillStyle = `rgba(255,255,255,${0.32 * (1 - tq)})`; c.fill();
      if (tq > 0) { c.beginPath(); c.arc(tx, ty, 34 + 60 * easeOutExpo(tq), 0, Math.PI * 2); c.strokeStyle = `rgba(255,255,255,${0.5 * (1 - tq)})`; c.lineWidth = 3; c.stroke(); }
    }
    return P;
  }

  // ---------- the many: a near grid melting into a loose crossing drift ----------
  const GRID = 120, GAP = 1.12, FIELD_SIDE = GRID * GAP * 16;
  const plantAt = (i, j) => PLANTS[(((i * 3 + j * 5 + ((i * j) % 3)) % PLANTS.length) + PLANTS.length) % PLANTS.length];
  function portrait(c, id, x, y, s) { s = kit.copyText(s); const M = SCR.mips[id], m = M.find((q) => q.width >= s) || M[M.length - 1]; c.drawImage(m, x - s / 2, y - s / 2, s, s); }
  const liftAt = (t) => { const q = clamp((t - T.lift[0]) / (T.lift[1] - T.lift[0])); return 1 - (1 - q) ** 3; };
  function tileSize(t) {
    const s0 = SCR.rects.plant.portrait[2] * 224 / 212 * U * 1.4;
    const e = easeInOutCubic(clamp((t - T.zoom[0]) / (T.zoom[1] - T.zoom[0])));
    return Math.exp(lerp(Math.log(s0 * (1 + 0.18 * liftAt(t))), Math.log(16), e));
  }
  const appearAt = (r) => T.grow + 0.32 * Math.log2(1 + r);
  const meltAt = (t) => easeInOutCubic(clamp((t - 6.55) / 1.05));
  // Optical softening precedes the end of the travel, so a shrinking grid can
  // never alias. Each persistent subject travels for the whole pull and count.
  const FIELD_END = Math.max(T.zoom[1], T.count[1]) + 0.48;
  function travelAt(t, n) {
    const q = clamp((t - n.moveStart) / (n.moveEnd - n.moveStart));
    return q * q * (3 - 2 * q) + n.bend * q * q * (1 - q) * (1 - q);
  }
  const closeAt = (t) => easeInOutCubic(clamp((t - T.close[0]) / (T.close[1] - T.close[0])));
  const closeSide = (t) => Math.exp(lerp(Math.log(16), Math.log(230 / (GRID * GAP)), closeAt(t))) * GRID * GAP;
  // Each tuple is a real result: [kind, held x, held y, diameter, depth, original].
  // Kinds index PLANTS, so another product can replace the captures and plantAt.
  const DRIFT = [
    [0, 432, 594, 205, 3, true], [1, 859, 329, 172, 2.91], [2, 1026, 719, 141, 3.25],
    [3, -12, 788, 206, 2.55], [4, 277, 149, 123, 3.5], [5, 637, 95, 105, 3.91],
    [6, 108, 426, 162, 2.43], [1, 91, 1416, 175, 3.8], [3, 429, 1731, 117, 4.31],
    [2, 911, 1503, 132, 4.72], [0, -109, 397, 805, 1.12],
    [2, -131, 1394, 834, 0.94], [3, 1157, 1972, 720, 1.23],
  ];
  const fieldSprites = new Map();
  function fieldSprite(id, original, melt) {
    const key = `${id}:${original}`;
    if (!fieldSprites.has(key)) fieldSprites.set(key, { pair: helper(512, 512), melt: -1 });
    const item = fieldSprites.get(key);
    if (item.melt === melt) return item.pair[0];
    const [c, x] = item.pair; x.reset(); x.imageSmoothingQuality = 'high';
    x.filter = `saturate(${1 - 0.18 * melt})`;
    x.drawImage(SCR.img[`portrait-${id}`], 0, 0, 512, 512); x.filter = 'none';
    x.globalCompositeOperation = 'multiply'; x.globalAlpha = melt;
    x.fillStyle = '#b8cba9'; x.fillRect(0, 0, 512, 512);
    x.globalCompositeOperation = 'source-atop'; x.globalAlpha = 0.1 * melt;
    x.fillStyle = MOSS; x.fillRect(0, 0, 512, 512); x.globalAlpha = 1;
    x.globalCompositeOperation = 'destination-in';
    const radius = 256 * 108 / 112;
    const inner = lerp(radius - 0.01, original ? 242 : 214, melt), outer = lerp(radius, original ? 248 : 228, melt);
    const edge = x.createRadialGradient(256, 256, inner, 256, 256, outer);
    edge.addColorStop(0, '#000'); edge.addColorStop(1, 'transparent');
    x.fillStyle = edge; x.fillRect(0, 0, 512, 512);
    item.melt = melt; return c;
  }
  // Prepared, padded Gaussian textures keep a CPU render cheap. Interpolate
  // premultiplied textures continuously in both softness and edge treatment;
  // no quantised blur steps and no separate sharp/soft scene layers.
  const SOFTNESS = [0, 0.008, 0.016, 0.03, 0.055, 0.09, 0.14, 0.21, 0.31, 0.45, 0.65, 0.9, 1.3, 2, 3];
  const banks = new Map(), [nodeC, NC] = helper(192, 192);
  function prepareBanks(id, original) {
    for (let style = 0; style <= 4; style++) {
      const source = fieldSprite(id, original, style / 4);
      for (let level = 0; level < SOFTNESS.length; level++) {
        const ratio = SOFTNESS[level], base = ratio < 0.06 ? 512 : ratio < 0.2 ? 256 : ratio < 0.6 ? 128 : 64;
        const pad = Math.ceil(base * ratio * 4) + 2, [c, x] = helper(base + pad * 2, base + pad * 2);
        x.imageSmoothingQuality = 'high'; x.filter = `blur(${(base * ratio).toFixed(6)}px)`;
        x.drawImage(source, pad, pad, base, base);
        banks.set(`${id}:${original}:${style}:${level}`, { c, edge: pad / base });
      }
    }
  }
  function depthPortrait(c, n, melt) {
    if (n.original) { c.drawImage(fieldSprite(n.id, true, melt), n.x - n.size / 2, n.y - n.size / 2, n.size, n.size); return; }
    const ratio = Math.min(SOFTNESS.at(-1), n.blur / n.size);
    let high = SOFTNESS.findIndex(r => r >= ratio); if (high < 0) high = SOFTNESS.length - 1;
    const low = Math.max(0, high - 1), b = high === low ? 0 : (ratio - SOFTNESS[low]) / (SOFTNESS[high] - SOFTNESS[low]);
    const style = melt * 4, a = Math.floor(style), d = style - a;
    const textures = [];
    for (const [part, weight] of [[a, 1 - d], [Math.min(4, a + 1), d]]) for (const [level, w] of [[low, 1 - b], [high, b]]) {
      if (weight * w > 0) textures.push({ ...banks.get(`${n.id}:${!!n.original}:${part}:${level}`), weight: weight * w });
    }
    const edge = 4 * ratio + 0.04, extent = 1 + 2 * edge;
    // A continuous footprint and fixed resolution avoid texture-level pops.
    const resolution = nodeC.width;
    NC.reset(); NC.beginPath(); NC.rect(0, 0, resolution, resolution); NC.clip();
    NC.clearRect(0, 0, resolution, resolution); NC.globalCompositeOperation = 'lighter'; NC.imageSmoothingQuality = 'high';
    for (const q of textures) {
      NC.globalAlpha = q.weight;
      NC.drawImage(q.c, (edge - q.edge) / extent * resolution, (edge - q.edge) / extent * resolution, (1 + 2 * q.edge) / extent * resolution, (1 + 2 * q.edge) / extent * resolution);
    }
    c.drawImage(nodeC, 0, 0, resolution, resolution, n.x - n.size * (0.5 + edge), n.y - n.size * (0.5 + edge), n.size * extent, n.size * extent);
  }
  let fieldNodes;
  function makeField() {
    let seed = 961;
    const random = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
    const nodes = DRIFT.map(([kind, x, y, size, z, original = false]) => ({ id: PLANTS[kind % PLANTS.length], x, y, size, z, original }));
    for (let i = 0; i < 145; i++) {
      const z = 3.8 + random() * 7.3;
      const x = -220 + random() * 1520, y = -230 + random() * 2380;
      if (x > 100 && x < 1030 && y > 825 && y < 1220) continue;
      const size = (480 + random() * 470) / z;
      nodes.push({ id: PLANTS[Math.floor(random() * PLANTS.length)], x, y, size, z, original: false });
    }
    // Give each subject one initial cell of the same kind. No replacement or
    // random regeneration at the handoff: the near grid's subjects become C3.
    const used = new Set(['0,0']);
    for (const node of nodes) {
      if (node.original) { node.i = 0; node.j = 0; }
      else {
        let best, distance = Infinity;
        for (let j = -16; j <= 16; j++) for (let i = -16; i <= 16; i++) {
          if (used.has(`${i},${j}`) || plantAt(i, j) !== node.id) continue;
          const d = (i - (node.x - 540) / 180) ** 2 + (j - (node.y - 960) / 180) ** 2;
          if (d < distance) { distance = d; best = [i, j]; }
        }
        [node.i, node.j] = best; used.add(best.join(','));
      }
      node.moveStart = 6.48 + random() * 0.22;
      node.moveEnd = FIELD_END - random() * 0.22;
      node.bend = (random() - 0.5) * 1.2;
      node.phase = random() * Math.PI * 2;
      node.driftX = (node.original ? 6 : 9 + random() * 9);
      node.driftY = (node.original ? 4 : 6 + random() * 8);
    }
    // The remaining near cells fall behind focus and dissolve. They never
    // become a scaled miniature sheet; C3's seeded subjects carry the distance.
    for (let j = -14; j <= 14; j++) for (let i = -14; i <= 14; i++) {
      if (!used.has(`${i},${j}`)) nodes.push({ id: plantAt(i, j), i, j, x: 540 + i * 160, y: 960 + j * 160, size: 70, z: 15 + Math.hypot(i, j), dissolve: true });
    }
    return nodes;
  }
  function many(c, t, cx, cy) {
    const melt = meltAt(t), close = closeAt(t), s = tileSize(t);
    const retreat = easeInOutCubic(clamp((t - 7.6) / 2.4));
    const camera = -0.43 * (1 - retreat) * melt, focus = 3 + camera;
    const subjects = [];
    for (const n of fieldNodes) {
      if (n.dissolve && melt === 1) continue;
      const r = Math.hypot(n.i, n.j), arrival = r === 0 ? 1 : spring(t - appearAt(r), 260, 20);
      if (arrival <= 0) continue;
      const travel = n.dissolve ? melt : travelAt(t, n);
      // Freeze each departing cell's world size, then retreat continuously to
      // its held size. A live shrinking grid would make it shrink then regrow.
      const nearSize = n.dissolve ? s : tileSize(Math.min(t, n.moveStart)), nearStep = nearSize * GAP;
      const age = Math.max(0, t - FIELD_END), driftTime = age - 0.65 * (1 - Math.exp(-age / 0.65));
      const dx = n.dissolve ? 0 : n.driftX * (Math.sin(n.phase + driftTime * 0.27) - Math.sin(n.phase));
      const dy = n.dissolve ? 0 : n.driftY * (Math.cos(n.phase + driftTime * 0.23) - Math.cos(n.phase));
